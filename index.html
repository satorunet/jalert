<style>
:root{
  --bg:#0f131a; --panel:#1a2130; --panel2:#232c3e; --text:#eef2f7; --muted:#9aa6b8;
  --red:#d32f2f; --red2:#b71c1c; --accent:#ffca28; --ok:#43a047; --warn:#fb8c00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:root{--ctrlH:186px;--banH:76px}
#app{max-width:1600px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top)) 16px calc(var(--ctrlH) + 8px + env(safe-area-inset-bottom))}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:60}
#main{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
h1{font-size:18px;margin:0;letter-spacing:.04em;white-space:nowrap}
#hud span{white-space:nowrap}
h1 span{color:var(--accent)}
#hud{display:flex;gap:12px;font-size:14px;color:var(--muted);align-items:center}
#hud b{color:var(--text);font-size:16px}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;color:var(--text);background:var(--panel2)}
button:active{transform:scale(.97)}
#dimBtn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:44px;padding:0 10px;border-radius:10px;font-weight:900;font-size:14px;text-decoration:none;color:#fff;background:linear-gradient(135deg,#7e57c2,#5e35b1);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#dimBtn:active{transform:translateY(1px)}
#menuBtn{width:40px;height:36px;padding:9px 9px;display:flex;flex-direction:column;justify-content:space-between;background:var(--panel2)}
#menuBtn span{display:block;height:3px;border-radius:2px;background:var(--text)}
/* サイドメニュー */
#drawer{position:fixed;inset:0;z-index:150;display:none}
#drawer.open{display:block}
#drawer .bg{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fadeIn .2s}
#drawer .panel{position:absolute;top:0;right:0;bottom:0;width:min(300px,82vw);background:var(--panel);box-shadow:-8px 0 30px rgba(0,0,0,.5);
  padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column;gap:8px;animation:slideIn .22s ease-out;overflow:auto}
@keyframes slideIn{from{transform:translateX(100%)}}
#drawer .dh{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin-bottom:4px}
#drawer .dh button{width:36px;height:36px;font-size:20px}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;font-size:16px;font-weight:700;text-align:left;background:var(--panel2)}
.mi .ic{font-size:20px;width:26px;text-align:center}
.mi .v{margin-left:auto;font-size:13px;color:var(--muted);font-weight:600}
.mystats{background:#141b28;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.8;color:var(--muted)}
.mystats b{color:var(--text)}
/* プレイ前の確認 */
.confirm h2{color:#ffca28}
.confirm .btns{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.confirm .btns button{padding:14px;font-size:16px;font-weight:800}
.confirm .ok{background:var(--red);color:#fff}
.confirm .mute{background:#37474f}
.confirm .back{background:transparent;color:var(--muted);font-weight:600}

#stage{position:relative;width:100%;height:100%;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#cv,#gl{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
#gl{z-index:0}
#cv{z-index:1}
/* 3D 版：ゲーム画面を大きく（比率を固定せず、空いている場所いっぱいに） */
#app{max-width:1600px!important}
#stage{width:100%!important;height:100%!important;aspect-ratio:auto!important}

#banner{flex:none;height:var(--banH);border-radius:10px;overflow:hidden;pointer-events:none;background:var(--panel);display:flex;flex-direction:column}
#banner .bar{flex:1}
#banner.idle .bar{background:var(--panel)}
#banner.idle .ttl{color:var(--accent);font-size:clamp(14px,3vw,20px)}
#banner.idle .sub{color:var(--muted)}
#banner.idle .time{display:none}
#banner.idle .info{display:none}
#banner .bar{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff;font-weight:800}
#banner .ttl{font-size:clamp(15px,3.4vw,26px);letter-spacing:.08em;white-space:nowrap}
#banner .sub{font-size:clamp(11px,2.1vw,15px);font-weight:600;opacity:.95;flex:1;min-width:0}
#banner .time{font-size:clamp(18px,4.4vw,34px);font-variant-numeric:tabular-nums;background:rgba(0,0,0,.35);padding:2px 10px;border-radius:8px;white-space:nowrap}
#banner.eq .bar{background:linear-gradient(#e53935,#b71c1c);animation:flash .5s steps(2) infinite}
#banner.ms .bar{background:linear-gradient(#212121,#000);border-bottom:4px solid #ff1744}
#banner.ms .ttl{color:#ff5252;animation:flash .6s steps(2) infinite}
#banner .info{background:rgba(0,0,0,.65);color:#fff;font-size:clamp(11px,2vw,14px);padding:4px 12px}
@keyframes flash{50%{filter:brightness(1.35)}}

.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.72);padding:calc(52px + env(safe-area-inset-top)) 16px calc(var(--ctrlH) + 12px + env(safe-area-inset-bottom));z-index:50;overflow:auto}
.overlay.hidden{display:none}
.card{background:var(--panel);border-radius:14px;padding:18px 20px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5);max-height:100%;overflow:auto;margin:auto}
.startBtn{display:block;width:100%;padding:20px;font-size:24px;font-weight:900;letter-spacing:.1em;background:var(--red);color:#fff;
  border-radius:14px;margin:14px 0;box-shadow:0 5px 0 var(--red2);animation:pulse 1.2s infinite}
.lead{font-size:15px!important}
.card h2{margin:4px 0 8px;font-size:clamp(20px,4vw,28px)}
.card p{margin:6px 0;line-height:1.6;font-size:14px}
.card ul{margin:6px 0;padding-left:20px;font-size:14px;line-height:1.7}
.warnbox{background:#3a2a10;border-left:4px solid var(--accent);padding:8px 10px;border-radius:6px;font-size:13px;color:#ffe9b0}
.tipbox{background:#13283a;border-left:4px solid #4fc3f7;padding:8px 10px;border-radius:6px;font-size:13px;line-height:1.6;margin-top:8px}
.big{display:block;width:100%;padding:14px;font-size:18px;font-weight:800;background:var(--red);margin-top:12px}
.big.blue{background:#1e88e5}
.judge{display:flex;align-items:center;gap:12px;margin:4px 0 8px}
.judge .mark{font-size:46px;font-weight:900;line-height:1}
.judge .lbl{font-size:22px;font-weight:800}
.judge .pts{margin-left:auto;font-size:22px;font-weight:800;color:var(--accent)}
.g-perfect .mark,.g-perfect .lbl{color:#66bb6a}
.g-good .mark,.g-good .lbl{color:#ffb74d}
.g-bad .mark,.g-bad .lbl{color:#ef5350}
.rank{font-size:64px;font-weight:900;text-align:center;color:var(--accent);line-height:1.1}
table.sum{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.sum td{padding:4px 6px;border-bottom:1px solid #2c3648}
table.sum td:last-child{text-align:right;font-weight:700}

#controls{position:fixed;left:0;right:0;bottom:0;z-index:110;display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:calc(var(--ctrlH) + env(safe-area-inset-bottom));padding:10px max(16px,calc((100vw - 1600px)/2 + 16px)) calc(10px + env(safe-area-inset-bottom));
  background:rgba(20,26,38,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid #2c3648;box-shadow:0 -6px 20px rgba(0,0,0,.35)}
#stick{--sz:150px;position:relative;width:var(--sz);height:var(--sz);flex:none;border-radius:50%;touch-action:none;cursor:grab;
  background:radial-gradient(circle,rgba(255,255,255,.05) 0 38%,rgba(255,255,255,.1) 39% 40%,rgba(255,255,255,.04) 41%);
  border:2px solid #3a4560;box-shadow:inset 0 0 18px rgba(0,0,0,.5)}
#stick::before{content:"";position:absolute;inset:6px;border-radius:50%;
  background:conic-gradient(from -8deg,rgba(255,255,255,.18) 0 16deg,transparent 0 90deg,rgba(255,255,255,.18) 0 106deg,transparent 0 180deg,rgba(255,255,255,.18) 0 196deg,transparent 0 270deg,rgba(255,255,255,.18) 0 286deg,transparent 0);
  -webkit-mask:radial-gradient(circle,transparent 0 86%,#000 87%);mask:radial-gradient(circle,transparent 0 86%,#000 87%)}
#knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 35% 30%,#7d8aa8,#3c4660 70%);box-shadow:0 4px 10px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.25);transition:transform .12s}
#stick.active #knob{transition:none;background:radial-gradient(circle at 35% 30%,#ffd54f,#f57c00 75%)}
#msg{flex:1;min-width:0;font-size:14px;line-height:1.5;color:var(--muted);text-align:center}
#msg b{color:var(--text)}
/* スーファミ風の4ボタン（右） */
#pad{--b:62px;flex:none;position:relative;width:calc(var(--b)*2.9);height:calc(var(--b)*2.9);border-radius:50%;background:radial-gradient(circle,#2a2f3d 60%,#232836 61%);box-shadow:inset 0 2px 8px rgba(0,0,0,.5)}
.pb{position:absolute;width:var(--b);height:var(--b);border-radius:50%;font-size:12px;font-weight:900;line-height:1.15;color:#fff;touch-action:none;padding:0;
  box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 -3px 6px rgba(0,0,0,.25),inset 0 3px 4px rgba(255,255,255,.25)}
.pb i{display:block;font-style:normal;font-size:10px;opacity:.75}
.pbb.tired{background:#6d6a5e;color:#bbb}
.pb:active,.pb.on{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 -2px 4px rgba(0,0,0,.25)}
.px{left:calc(50% - var(--b)/2);top:4%;background:#3f6fd1}
.py{left:4%;top:calc(50% - var(--b)/2);background:#3a9a4e}
.pa{right:4%;top:calc(50% - var(--b)/2);background:#d6322c}
.pbb{left:calc(50% - var(--b)/2);bottom:4%;background:#e0b021;color:#3a2a00}
#actBtn.pa{width:calc(var(--b)*1.12);height:calc(var(--b)*1.12);top:calc(50% - var(--b)*.56);right:1%;font-size:12px}
#actBtn.ready{background:#ff3b30;color:#fff;animation:pulse 1s infinite}
#actBtn.on{background:var(--ok);color:#fff;animation:none}
@keyframes pulse{50%{transform:scale(1.05)}}
#hud .on{color:#66bb6a}
#hud .on.off{color:var(--muted)}
.doa{font-size:clamp(44px,12vw,72px);font-weight:900;text-align:center;letter-spacing:.2em;line-height:1.1;margin:2px 0 4px}
.doa.alive{color:#69f0ae;text-shadow:0 0 18px rgba(105,240,174,.5)}
.cause{text-align:center;font-size:clamp(20px,5vw,28px);font-weight:900;color:#fff;background:#3b0b0b;border:2px solid #ff1744;border-radius:10px;padding:6px 10px;margin:0 auto 8px;width:fit-content;max-width:100%}
.doa.dead{color:#ff5252;text-shadow:0 0 18px rgba(255,82,82,.5)}
.surv{margin-top:8px;background:#141b28;border-radius:10px;padding:10px}
.surv .rate{display:flex;align-items:baseline;gap:10px}
.surv .rate span{color:var(--muted);font-size:13px;font-weight:700}
.surv .rate b{font-size:30px;font-weight:900;color:var(--accent)}
.surv .rate small{color:var(--muted);font-size:12px;margin-left:auto}
.surv .bar{height:8px;border-radius:99px;background:#7f1d1d;overflow:hidden;margin:6px 0 8px}
.surv .bar i{display:block;height:100%;background:#2e7d32}
.surv .grp{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:12px}
.surv .gh{width:100%;font-weight:800;font-size:13px}
.surv .grp.a .gh{color:#69f0ae}
.surv .grp.d .gh{color:#ff5252}
.surv .grp span{padding:2px 8px;border-radius:99px;font-weight:700}
.surv .grp.a span{background:#1b5e20;color:#b9f6ca}
.surv .grp.d span{background:#7f1d1d;color:#ffcdd2}
.surv .grp span.npc{opacity:.8;font-weight:600}
.surv .grp em{color:var(--muted);font-style:normal}
.plist{margin-top:8px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px}
.plist .ph{width:100%;color:var(--muted);margin-bottom:2px}
.plist span{padding:2px 8px;border-radius:99px;font-weight:700}
.plist .a{background:#1b5e20;color:#b9f6ca}
.plist .d{background:#7f1d1d;color:#ffcdd2}
.nextInfo{text-align:center;color:var(--accent);font-weight:800;margin-top:10px}
#chatLog{position:absolute;left:8px;bottom:8px;max-width:62%;display:flex;flex-direction:column;gap:3px;pointer-events:none;z-index:4}
#chatLog .cl{background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 8px;border-radius:8px;transition:opacity 1s;word-break:break-all}
#chatLog .cl.fade{opacity:0}
#chatPanel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:rgba(15,20,30,.92);padding:6px;display:none;flex-direction:column;gap:6px}
#chatPanel.open{display:flex}
#chatPresets{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
#chatPresets button{flex:none;padding:6px 10px;font-size:12px;font-weight:700;background:#33415c;border-radius:99px}
#chatPanel .crow{display:flex;gap:6px}
#chatIn{flex:1;min-width:0;font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid #3a4560;background:#0f1520;color:var(--text);-webkit-user-select:text;user-select:text}
#chatPanel .crow button{padding:0 12px;font-size:13px;font-weight:700}
#chatSend{background:#1e88e5}
.rtabs{display:flex;gap:6px;margin:4px 0 8px}
.rtab{flex:1;padding:8px;font-size:13px;font-weight:700;background:#1f2738;color:var(--muted)}
.rtab.on{background:#2e7d32;color:#fff}
table.rk td.al{color:#69f0ae;font-weight:900}
.rkTitle{max-height:220px;overflow:auto}
.tfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding-top:10px;border-top:1px solid #2c3648;font-size:12px;color:var(--muted)}
.tfoot a{color:#90caf9;text-decoration:none}
.tfoot a:hover{text-decoration:underline}
.tfoot .gh{display:inline-flex;align-items:center;gap:5px;color:#e3e8ef;font-weight:700}
.rkh{margin-top:10px;font-weight:800;color:var(--accent);font-size:13px}
table.rk{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
table.rk th{color:var(--muted);font-weight:600;text-align:left;padding:3px 6px;border-bottom:1px solid #2c3648}
table.rk td{padding:4px 6px;border-bottom:1px solid #222b3b;white-space:nowrap}
table.rk td:nth-child(2){white-space:normal;word-break:break-all}
table.rk td:nth-child(n+3){text-align:right;font-variant-numeric:tabular-nums}
table.rk tr:nth-child(2) td:first-child{color:#ffd54f;font-weight:900}
table.rk tr.me td{background:#2a3550;color:#fff;font-weight:800}
table.rk tr.gap td{text-align:center;color:var(--muted);border:none}
.nameIn{display:block;width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:2px solid #3a4560;background:#0f1520;color:var(--text);margin-top:10px;-webkit-user-select:text;user-select:text}
.nameIn:focus{outline:none;border-color:var(--accent)}

/* ====== スマホのアラート画面 ====== */
#phoneWrap{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);z-index:200;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
#phoneWrap.show{display:flex}
.phone{height:min(100%,700px);aspect-ratio:9/19.5;max-width:calc(100vw - 32px);background:#0c0c0e;border-radius:min(52px,7.5vh);padding:min(11px,1.4vh);
  box-shadow:0 0 0 2px #3a3a3e,0 0 0 4px #1a1a1c,0 24px 70px rgba(0,0,0,.8);position:relative;animation:phIn .35s cubic-bezier(.2,.9,.3,1.2)}
.phone.buzz{animation:phIn .35s cubic-bezier(.2,.9,.3,1.2),buzz .09s linear .35s 30}
.phone::before,.phone::after{content:"";position:absolute;width:3px;background:#2a2a2e;border-radius:2px}
.phone::before{left:-4px;top:20%;height:9%}
.phone::after{right:-4px;top:26%;height:13%}
@keyframes phIn{from{transform:translateY(40px) scale(.92);opacity:0}}
@keyframes buzz{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-.7deg)}75%{transform:translate(3px,-1px) rotate(.7deg)}}
.screen{position:relative;width:100%;height:100%;border-radius:min(42px,6.2vh);overflow:hidden;container-type:size;color:#fff;
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
.ios .screen{background:radial-gradient(120% 70% at 20% 10%,#5b6fb5 0,transparent 60%),radial-gradient(90% 60% at 90% 90%,#8a4f7d 0,transparent 60%),linear-gradient(170deg,#2b3560,#141a2e)}
.android .screen{background:radial-gradient(100% 60% at 80% 0,#3f7a6b 0,transparent 60%),linear-gradient(180deg,#1f2a2a,#0e1414)}
.island{position:absolute;top:1.3cqh;left:50%;transform:translateX(-50%);width:32cqw;height:3.6cqh;background:#000;border-radius:99px;z-index:3}
.android .island{width:3.2cqh;height:3.2cqh;top:1.4cqh}
.sbar{position:absolute;top:0;left:0;right:0;height:6.2cqh;display:flex;align-items:center;justify-content:space-between;padding:0 8cqw 0 9cqw;font-size:4cqw;font-weight:600;z-index:2}
.android .sbar{padding:0 6cqw;font-size:3.6cqw;font-weight:500;height:5.6cqh}
.sbar .ic{display:flex;align-items:center;gap:1.4cqw}
.bars{display:flex;align-items:flex-end;gap:.5cqw;height:2.6cqw}
.bars i{display:block;width:.9cqw;background:#fff;border-radius:.3cqw}
.batt{width:6.4cqw;height:3cqw;border:.35cqw solid rgba(255,255,255,.7);border-radius:.9cqw;padding:.35cqw;position:relative}
.batt::after{content:"";position:absolute;right:-1cqw;top:30%;height:40%;width:.6cqw;background:rgba(255,255,255,.7);border-radius:0 .4cqw .4cqw 0}
.batt b{display:block;height:100%;width:72%;background:#fff;border-radius:.4cqw}
.lock{position:absolute;top:10cqh;left:0;right:0;text-align:center}
.lock .date{font-size:4.6cqw;font-weight:600;opacity:.92}

<div id="app">
  <header>

  <div id="banner" class="idle">

    </div>
    <div class="overlay" id="ov"></div>
  </div>
  </div>

  <div id="controls">
    <div id="stick"><div id="knob"></div></div>
    <div id="msg">スタートを押してね</div>
    <div id="pad">
      <button id="talkBtn" class="pb px"><i>X</i>話す</button>
      <button id="jumpBtn" class="pb py"><i>Y</i>ジャンプ</button>
      <button id="actBtn" class="pb pa"><i>A</i>伏せる</button>
      <button id="runBtn" class="pb pbb"><i>B</i>走る</button>
    </div>
  </div>

  <div id="drawer">
    <div class="bg"></div>
    <div class="panel">

        <div class="homebar"></div>

    </div>

</div>

// エリアの読み込み（グリッドとタイル位置の索引）
const areaCache = {};
function getArea(key){
  if (areaCache[key]) return areaCache[key];
  const a = AREAS[key];
  const grid = a.map.map(r => r.padEnd(COLS,'.').slice(0,COLS).split(''));
  const byChar = {};
  grid.forEach((row,y) => row.forEach((c,x) => (byChar[c] = byChar[c] || []).push({x,y})));
  const portalAt = {};
  for (const p of a.portals || []) portalAt[p.y*COLS + p.x] = p;
  return areaCache[key] = {key, ...a, grid, byChar, portalAt};
}

// ====== オーディオ ======
let AC = null, master = null, bus = null, muted = false;
function initAudio(){
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C(); master = AC.createGain(); master.gain.value = muted ? 0 : 0.7; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
}
function newBus(){
  stopBus();
  if (!AC) return null;
  bus = AC.createGain(); bus.gain.value = 1; bus.connect(master); return bus;
}
function stopBus(){
  if (bus && AC){
    const b = bus; const t = AC.currentTime;
    b.gain.cancelScheduledValues(t); b.gain.setValueAtTime(b.gain.value, t); b.gain.linearRampToValueAtTime(0, t+0.25);
    setTimeout(() => { try{ b.disconnect(); }catch(e){} }, 400);
  }
  bus = null;
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function beep(f, t0, dur, type, vol, out){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(out || master);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
let noiseBuf = null;
function noise(){
  if (!noiseBuf){
    noiseBuf = AC.createBuffer(1, AC.sampleRate*2, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); let last = 0;
    for (let i=0;i<d.length;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = w*0.5 + last*3; }
  }
  const s = AC.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
}
let jaVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /ja[-_]JP/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, rate){
  if (muted || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = rate || 1.05; u.pitch = 1; u.volume = 1;
  if (jaVoice) u.voice = jaVoice;
  speechSynthesis.speak(u);
}
const timers = [];
function later(ms, fn){ timers.push(setTimeout(fn, ms)); }
function clearLater(){ while (timers.length) clearTimeout(timers.pop()); }

// 音声ファイル（sounds/ に置くと合成音の代わりに再生。無ければ合成音）
const SOUND_FILES = {eq:'sounds/eew', ms:'sounds/missile'};
const SOUND_V = {eq:'80df5d583b', ms:'8893bf79d5'};   // キャッシュバスター（bust.sh が中身のハッシュを書き込む）
const sndBuf = {};
async function loadSoundFiles(){
  for (const [k, base] of Object.entries(SOUND_FILES)){
    for (const ext of ['mp3','m4a','wav','ogg']){
      try{
        const r = await fetch(`${base}.${ext}?v=${SOUND_V[k] || ''}`, {cache:'no-cache'});
        if (!r.ok) continue;
        sndBuf[k] = await AC.decodeAudioData(await r.arrayBuffer());
        break;
      }catch(e){}
    }
  }
}

function connect(){
  let ws;

  const failT = setTimeout(() => { if (!NET.online) goLocal(); }, 3500);

  ws.onmessage = e => {

    if (m.now){
      const off = m.now - Date.now();
      if (!NET.synced || off > NET.offset) NET.offset = off; else NET.offset = NET.offset*0.98 + off*0.02;
      NET.synced = true;
    }
    if (m.t === 'welcome'){ NET.id = m.id; NET.online = true; NET.retry = 0; clearTimeout(failT); updHud(); }
    else if (m.t === 'round'){ if (G.joined){ NET.online = true; onRound(m.r); } }

function recvPlayers(ps){
  const seen = new Set();
  for (const [id, name, x, y, c, f, hue, a, tr, k, j, d] of ps){
    if (id === NET.id) continue;
    seen.add(id);
    let o = NET.players.get(id);
    if (!o){ o = {x, y}; NET.players.set(id, o); }
    if (o.a !== a){ o.x = x; o.y = y; }
    if (o.tx !== undefined){ o.vx = x - o.tx; o.vy = y - o.ty; }
    if (j && !o.j) o.jumpT0 = performance.now();
    Object.assign(o, {id, name, tx:x, ty:y, c, f, hue, a, tr, k, j, d});
  }
  for (const id of [...NET.players.keys()]) if (!seen.has(id)) NET.players.delete(id);

// ====== 偶然要素（ラウンドごとの乱数。サーバの seed から全員同じ結果になる） ======
function mulberry(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function strHash(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const hzCache = {};
function hz(A){
  const key = `${G.seed||0}:${A.key}:${G.type}:${G.L}`;
  if (hzCache[key]) return hzCache[key];
  // 固定済みの家具（見た目でわかる）
  const rf = mulberry(strHash(`${G.seed||0}:${A.key}:fix`));
  const fixed = new Set();
  for (const c of ['S','K']) for (const q of A.byChar[c] || []) if (rf() < 0.35) fixed.add(q.y*COLS + q.x);
  const r = mulberry(strHash(key));
  // 爆風が遠くまで届く窓
  const blow = [];
  for (const q of A.byChar.W || []) if (r() < 0.4) blow.push(q);
  // 天井・外壁の崩落 / ミサイルの破片が落ちる場所（予測できない）
  const floor = [];
  A.grid.forEach((row,y) => row.forEach((c,x) => { if (!SOLID.has(c) && !PORTAL_TILES.has(c) && !'DZQMX'.includes(c)) floor.push({x,y}); }));
  let n = G.type === 'eq' ? [1,2,4,6][G.L] || 2 : (A.indoor ? 0 : 3);
  if (A.tsunami) n = 0;
  const spots = [];
  for (let i=0; i<n && floor.length; i++){ const q = floor.splice(Math.floor(r()*floor.length), 1)[0]; spots.push({x:q.x+.5, y:q.y+.5}); }
  return hzCache[key] = {fixed, blow, spots};
}

function bfsA(A, sx, sy, goal){
  const prev = new Map(), key = (x,y) => y*COLS+x, q = [[sx,sy]];
  prev.set(key(sx,sy), null);
  while (q.length){
    const [x,y] = q.shift();
    if (goal(x,y)){
      const path = []; let k = key(x,y);
      while (k !== null){ path.unshift({x:k%COLS, y:(k/COLS)|0}); k = prev.get(k); }
      return path;
    }
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, ny = y+dy, nk = key(nx,ny);
      if (walkA(A,nx,ny) && !prev.has(nk)){ prev.set(nk, key(x,y)); q.push([nx,ny]); }
    }
  }
  return null;
}
// 「来た場所へ」の行き先。建物の中・地下からの出口は、必ず外（最後にいた屋外）へ出る
function backDest(A, stack, consume){
  if (A.indoor || A.underground){
    for (let i = stack.length-1; i >= 0; i--) if (!AREAS[stack[i].area].indoor){ const d = stack[i]; if (consume) stack.length = i; return d; }
    if (consume) stack.length = 0;
    return A.back ? {...A.back} : null;
  }
  const d = stack[stack.length-1];
  if (d){ if (consume) stack.pop(); return d; }
  return A.back ? {...A.back} : null;
}
// 出入口・階段・エレベーターの行き先（@back はそのエリアの既定の戻り先）
function portalDest(A, pt){
  if (pt.to === '@back') return A.back ? {area:A.back.area, x:A.back.x, y:A.back.y} : null;
  return {area:pt.to, x:pt.tx, y:pt.ty};
}
// シーンの開始エリアから出入口でつながるエリア（2つ先まで）
function sceneAreas(start){
  const seen = new Map([[start, 0]]), q = [start];
  while (q.length){
    const k = q.shift(), d = seen.get(k);
    if (d >= 2) continue;
    const A = getArea(k);
    for (const pt of A.portals || []){
      const dst = portalDest(A, pt);
      if (dst && !seen.has(dst.area)){ seen.set(dst.area, d+1); q.push(dst.area); }
    }
  }
  return [...seen.keys()];
}

let lastChatter = 0;
function npcChatter(n, now){
  if (n.say && n.say.until > now) return;
  n.chatT = (n.chatT ?? (2 + n.r()*8)) - 1/60;
  if (n.chatT > 0) return;
  n.chatT = 5 + n.r()*9;
  if (now - lastChatter < 900) return;          // 同時にしゃべりすぎない
  const lines = [...(NPC_TALK_ROLE[n.role] || []), ...(NPC_TALK[n.a] || ['…'])];
  n.say = {text: lines[Math.floor(n.r()*lines.length)], until: now + 2800};
  lastChatter = now;
}
function spawnNPCs(){
  const r = mulberry(strHash(`${G.seed}:npc`));
  G.npcs = [];
  let id = 0;
  for (const key of sceneAreas(G.A.key)){
    const A = getArea(key);
    const pool = ((G.scene && G.scene.night && NPC_POOL_NIGHT[key]) || NPC_POOL[key] || ['通行人']).map(e => { const [nm, mx] = e.split(':'); return {nm, mx: mx ? +mx : 99}; });
    const used = {};
    const cand = [];
    A.grid.forEach((row,y) => row.forEach((c,x) => { if (walkA(A,x,y) && !A.portalAt[y*COLS+x]) cand.push({x,y}); }));
    const n = key === G.A.key ? 14 + Math.floor(r()*9) : (A.indoor ? 6 : 8) + Math.floor(r()*5);
    for (let i=0; i<n && cand.length && G.npcs.length < 70; i++){
      const q = cand.splice(Math.floor(r()*cand.length), 1)[0];
      const b = r();
      const ok = pool.filter(e => (used[e.nm] || 0) < e.mx);
      const pick = (ok.length ? ok : pool)[Math.floor(r()*(ok.length || pool.length))];
      used[pick.nm] = (used[pick.nm] || 0) + 1;
      // 同じ役が何人もいるときは A・B… をつける
      const nm = pick.mx === 99 && used[pick.nm] > 1 ? pick.nm + String.fromCharCode(64 + used[pick.nm]) : pick.nm;
      const spd = /おばあ|おじい|車いす|酔っぱらい/.test(nm) ? 0.55 : /子ども|小学生|妹|弟/.test(nm) ? 0.85 : 0.85 + r()*0.35;
      const col = NPC_COLOR[pick.nm];
      G.npcs.push({id:'npc'+id, name:nm, role:pick.nm, a:key, x:q.x+.5, y:q.y+.5, path:[], face:1, walk:0, c:0, hue: r()*360|0, col,
        beh: b < .45 ? 'smart' : b < .8 ? 'panic' : 'freeze', react: 0.4 + r()*2.2, think: r()*3, reacted:false,
        alive:true, say:null, transit:null, back:[], plan:null, spd, blocked:0, r: mulberry(strHash(`${G.seed}:npc${id}`))});
      id++;
    }
  }
}
// エリア内の「最も安全な場所」（ラウンド中はキャッシュ）
function perfectSet(A){
  const key = `${G.seed}:${A.key}:${G.type}:${G.L}`;
  G.perfCache = G.perfCache || {};
  if (G.perfCache[key]) return G.perfCache[key];
  const set = new Set();
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++)
    if (walkA(A,x,y) && !A.portalAt[y*COLS+x] && locEval(A, x+.5, y+.5, G.type, G.L).g === 'perfect') set.add(y*COLS+x);
  return G.perfCache[key] = set;
}
function npcSay(n, list){ n.say = {text: list[Math.floor(n.r()*list.length)], until: nowMs() + 2600}; }
// NPC が出入口に着いたら別のエリアへ
function npcPortal(n, A, pt){
  let dest;
  if (pt.to === '@back') dest = backDest(A, n.back, true);
  else {
    for (const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
      const x = pt.x+dx, y = pt.y+dy;
      if (walkA(A,x,y) && !A.portalAt[y*COLS+x]){ n.back.push({area:A.key, x:x+.5, y:y+.5}); break; }
    }
    dest = portalDest(A, pt);
  }
  if (!dest) return;
  n.path = [];
  if (pt.kind === 'door'){ n.a = dest.area; n.x = dest.x; n.y = dest.y; n.arrived = true; }
  else n.transit = {kind:pt.kind, until: nowMs() + (pt.dur || 1.5)*1000, dest};
}
// 避難の行き先を決める
function npcPlan(n){
  const A = getArea(n.a), sx = Math.floor(n.x), sy = Math.floor(n.y);
  const isShelterPortal = (x,y) => { const pt = A.portalAt[y*COLS+x]; if (!pt) return false; const d = portalDest(A, pt); return !!(d && (AREAS[d.area].indoor || AREAS[d.area].underground)); };
  if (n.beh === 'smart'){
    const claimed = G.claimed || (G.claimed = new Set());
    const perf = perfectSet(A);
    let path = bfsA(A, sx, sy, (x,y) => perf.has(y*COLS+x) && !claimed.has(A.key+':'+(y*COLS+x)));
    if (path){ const t = path[path.length-1]; claimed.add(A.key+':'+(t.y*COLS+t.x)); }
    else path = bfsA(A, sx, sy, isShelterPortal);
    n.path = path || [];
    if (!n.path.length) n.c = 1;
  } else if (n.beh === 'panic'){
    // パニック：3割は出口へ飛び出す、それ以外は走り回る
    let path = null;
    if (A.indoor && n.r() < 0.65){
      const toOutside = (x,y) => { const pt = A.portalAt[y*COLS+x]; if (!pt || pt.kind === 'elevator') return false; const d = portalDest(A, pt); return !!(d && !AREAS[d.area].indoor); };
      path = bfsA(A, sx, sy, toOutside) || bfsA(A, sx, sy, (x,y) => { const pt = A.portalAt[y*COLS+x]; return !!(pt && pt.kind !== 'elevator'); });
      if (path) npcSay(n, ['外に逃げろー！','出口はどこ!?','早く外へ！','逃げなきゃ！']);
    }

// 密集度：同じエリアで半径0.8以内に何人いるか（倒れた人も数える）
function crowdCount(area, x, y, self){
  let c = 0;
  for (const o of G.npcs || []) if (o !== self && o.a === area && !o.transit && Math.hypot(o.x-x, o.y-y) < 0.8) c++;
  const p = G.p;
  if (p && p !== self && G.A && G.A.key === area && !p.transit && Math.hypot(p.x-x, p.y-y) < 0.8) c++;
  for (const o of NET.players.values()) if (o.a === area && !o.tr && Math.hypot(o.x-x, o.y-y) < 0.8) c++;

}
// 人込みの圧迫：身動きがとれない状態が続くとたまっていき、限界を超えると圧死
function updatePressure(ag, area, dt, blocked){
  const c = crowdCount(area, ag.x, ag.y, ag);
  if (c >= 3 && (blocked || c >= 4)) ag.pressure = (ag.pressure || 0) + dt*(c-2)*0.55;
  else ag.pressure = Math.max(0, (ag.pressure || 0) - dt*0.8);

}
// 人込み：近づく方向にだけブロック（重なっていても離れる動きはできる）
const CROWD_R = 0.52;
function crowdBlock(self, area, x, y){
  const chk = (ox, oy) => {
    const nd = Math.hypot(ox-x, oy-y);
    return nd < CROWD_R && nd < Math.hypot(ox-self.x, oy-self.y);
  };
  for (const o of G.npcs || []) if (o !== self && o.a === area && !o.transit && chk(o.x, o.y)) return true;
  const p = G.p;
  if (p && self !== p && G.A && G.A.key === area && !p.transit && chk(p.x, p.y)) return true;
  return false;
}
// 押しのける：進む方向にいる人を少しだけ押し出す（押された人は圧迫がたまる）
function pushCrowd(p, dx, dy, sp){
  const l = Math.hypot(dx, dy) || 1; const ux = dx/l, uy = dy/l;
  const A = G.A, now = nowMs();
  for (const n of G.npcs || []){
    if (n.a !== A.key || n.transit || n.crushed) continue;
    const rx = n.x - p.x, ry = n.y - p.y, d = Math.hypot(rx, ry);
    if (d > 0.62 || rx*ux + ry*uy < 0.1) continue;       // 前にいる人だけ
    const push = sp * 0.35;
    const nx = n.x + ux*push, ny = n.y + uy*push;
    if (canStandA(A, nx, ny)){ n.x = nx; n.y = ny; }
    else { const sx = n.x - uy*push, sy = n.y + ux*push; if (canStandA(A, sx, sy)){ n.x = sx; n.y = sy; } }
    n.pressure = (n.pressure || 0) + push*1.5;
    if ((!n.say || n.say.until < now) && n.r() < 0.04) npcSay(n, ['押さないで！','ちょっと！','痛っ！']);
  }
}
function canStandA(A, x, y){
  const r = 0.27;
  return walkA(A,Math.floor(x-r),Math.floor(y-r)) && walkA(A,Math.floor(x+r),Math.floor(y-r)) && walkA(A,Math.floor(x-r),Math.floor(y+r)) && walkA(A,Math.floor(x+r),Math.floor(y+r));
}
function updateNPCs(dt){
  if (!G.npcs) return;
  const st = G.state;
  if (!(st === 'normal' || st === 'alert')) return;
  const now = nowMs();
  for (const n of G.npcs){
    if (n.transit){
      if (now >= n.transit.until){ const d = n.transit.dest; n.transit = null; n.a = d.area; n.x = d.x; n.y = d.y; n.arrived = true; }
      else continue;
    }
    const A = getArea(n.a);
    if (st === 'alert' && !n.reacted && (G.limit0 - G.timer) >= n.react){
      n.reacted = true; n.path = [];
      if (n.beh === 'smart') npcSay(n, A.tsunami ? NPC_SAY.smart.tsunami : NPC_SAY.smart[G.type]);
      else npcSay(n, n.beh === 'panic' ? NPC_SAY.panic : NPC_SAY.freeze);
      npcPlan(n);
    }
    // 別のエリアに着いたら、そこで避難先を決め直す
    if (n.arrived){ n.arrived = false; if (st === 'alert' && n.reacted && !n.c) npcPlan(n); }
    if (n.crushed) continue;
    if (st === 'alert'){
      if (updatePressure(n, n.a, dt, n.blocked > 0.3)){
        n.crushed = true; n.c = 0; n.path = [];
        n.say = {text:'ぐっ…', until: now + 2000};
        if (G.A && n.a === G.A.key && AC) beep(90, AC.currentTime, 0.25, 'sine', 0.25);
        continue;
      }
      if (n.pressure > 1.8 && (!n.say || n.say.until < now) && n.r() < dt*1.5) npcSay(n, ['苦しい…！','押すな！','つぶれる…','息が…']);
    }
    if (n.c) continue;
    if (st === 'normal' && !n.crushed) npcChatter(n, now);
    // 普段はぶらぶら。ときどき外に出たり、建物に入ったりする
    if (st === 'normal' && !n.path.length){
      n.think -= dt;
      if (n.think <= 0){
        n.think = 1.5 + n.r()*3.5;
        const sx = Math.floor(n.x), sy = Math.floor(n.y);
        if (n.r() < 0.18 && (A.portals || []).length){
          const pts = A.portals.filter(pt => pt.kind !== 'elevator' || n.r() < 0.3);
          const pt = pts[Math.floor(n.r()*pts.length)];
          if (pt) n.path = bfsA(A, sx, sy, (x,y) => x === pt.x && y === pt.y) || [];
        } else {
          const tx = Math.floor(n.x + (n.r()-.5)*8), ty = Math.floor(n.y + (n.r()-.5)*6);
          n.path = bfsA(A, sx, sy, (x,y) => !A.portalAt[y*COLS+x] && Math.abs(x-tx)+Math.abs(y-ty) < 2) || [];
        }
      }
    }
    if (n.path.length){
      const sp = (st === 'alert' ? (n.beh === 'panic' ? 4.2 : 3.4) : 1.6) * n.spd * dt;
      const q = n.path[0], tx = q.x+.5, ty = q.y+.5, dx = tx-n.x, dy = ty-n.y, d = Math.hypot(dx,dy);
      let moved = false;
      if (d <= sp && !crowdBlock(n, n.a, tx, ty)){ n.x = tx; n.y = ty; n.path.shift(); moved = true; }
      else if (d > sp){
        const ux = dx/d, uy = dy/d;
        // 正面がふさがっていたら少し横にずれて進む
        for (const [ax, ay, k] of [[ux, uy, 1], [ux*.5 - uy*.87, uy*.5 + ux*.87, .5], [ux*.5 + uy*.87, uy*.5 - ux*.87, .5]]){
          const nx = n.x + ax*sp*k, ny = n.y + ay*sp*k;
          if (!crowdBlock(n, n.a, nx, ny) && canStandA(A, nx, ny)){ n.x = nx; n.y = ny; moved = true; break; }
        }
        if (Math.abs(dx) > .01) n.face = Math.sign(dx);
      }
      if (moved){ n.walk += dt; n.blocked = Math.max(0, n.blocked - dt); }
      else {
        n.blocked += dt;
        if (st === 'alert' && n.blocked > 0.8 && (!n.say || n.say.until < now) && n.r() < dt*2) npcSay(n, ['押さないで！','通して！','進めない…','どいて！','痛い！']);
        if (n.blocked > 1.6){ n.blocked = 0; if (st === 'alert') npcPlan(n); else n.path = []; }
        continue;
      }
      if (!n.path.length){
        const pt = A.portalAt[Math.floor(n.y)*COLS + Math.floor(n.x)];
        if (pt){ npcPortal(n, A, pt); continue; }
        if (st === 'alert'){
          if (n.beh === 'smart') n.c = 1;
          else if (n.beh === 'panic'){
            if (G.timer < 3 && n.r() < .5) n.c = 1;
            else npcPlan(n);
          }
        }
      }
    }
  }
}
function judgeNPCs(){

function bubble(X, Y, text){

}

// ====== 判定 ======
function nearDist(A, px, py, chars, skip){
  let best = 99;
  for (const c of chars) for (const q of (A.byChar[c] || [])){
    if (skip && skip.has(q.y*COLS + q.x)) continue;
    const dx = Math.max(q.x - px, 0, px - (q.x+1));
    const dy = Math.max(q.y - py, 0, py - (q.y+1));
    best = Math.min(best, Math.hypot(dx, dy));
  }
  return best;
}
const tileOf = (A, x, y) => { const tx = Math.floor(x), ty = Math.floor(y);
  if (tx<0||ty<0||tx>=COLS||ty>=ROWS) return '#'; return A.grid[ty][tx]; };

const SHINDO_L = {'5強':0, '6弱':1, '6強':2, '7':3};
// 屋外から、建物の中・地下へ入れる入口まで何マス歩くか
function shelterSteps(A, px, py){
  const targets = new Set();
  for (const pt of A.portals || []){
    const to = pt.to === '@back' ? (A.back && A.back.area) : pt.to;
    const B = to && AREAS[to];
    if (B && (B.indoor || B.underground)) targets.add(pt.y*COLS + pt.x);
  }
  if (!targets.size) return 99;
  const sx = Math.floor(px), sy = Math.floor(py);
  const seen = new Map([[sy*COLS+sx, 0]]), q = [[sx,sy]];
  while (q.length){
    const [x,y] = q.shift(), d = seen.get(y*COLS+x);
    if (targets.has(y*COLS+x)) return d;
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, ny = y+dy, k = ny*COLS+nx;
      if (walkA(A,nx,ny) && !seen.has(k)){ seen.set(k, d+1); q.push([nx,ny]); }
    }
  }
  return 99;
}
// 場所だけの安全度（perfect / good / bad）と死因 c。L は震度レベル（0:5強〜3:7）で、大きいほど危険範囲が広がる
function locEval(A, px, py, type, L){

  if (type === 'eq'){
    if (A.refuge) return {g:'perfect', m:'津波避難ビルの上の階に避難できました。'};
    if (nearDist(A,px,py,['F']) < 1.8 + L*0.4) return {g:'bad', c:'landslide', m:'崖が崩れ、土砂崩れに巻き込まれました。崖や斜面から離れる。'};

      return {g:'good', c:'debris', m:'急ブレーキで車内で転倒する危険があります。手すりにつかまるか座席へ。'};
    }

      if (nearDist(A,px,py,['O']) < 0.9 || nearDist(A,px,py,['#']) < 0.6) return {g:'perfect', m:'地下は比較的揺れが小さい。柱や壁のそばで身を守りました。'};

  if (crushed){ grade = 'bad'; cause = 'crush'; msgs.push('人込みに巻き込まれ、押しつぶされました（圧死）。出口に殺到しない、人の流れに逆らわない。'); }
  else if (stuck === 'elevator' && type === 'eq'){ grade = 'bad'; cause = 'elevator'; msgs.push('エレベーターが緊急停止し、閉じ込められました。地震のときはエレベーターを使わない。'); }
  else if (stuck === 'stairs' && type === 'eq'){ grade = 'bad'; cause = 'stairs'; msgs.push('階段の途中で強い揺れに遭い、転落しました。揺れている間は移動しない。'); }
  else if (stuck === 'elevator'){ grade = 'bad'; cause = 'elevator'; msgs.push('着弾の停電でエレベーターが緊急停止し、閉じ込められました。避難にエレベーターは使わない。'); }
  else if (stuck){ grade = 'good'; msgs.push('階段で建物の中を移動中でした。窓のない場所で止まって伏せるとさらに安全。'); }
  else {
    const r = locEval(A, x, y, type, L);
    grade = r.g; cause = r.c || null; msgs.push(r.m);
    if (type === 'eq'){
      if (!crouch && !A.tsunami){
        if (L >= 1 || grade !== 'perfect'){ grade = 'bad'; cause = cause || 'debris'; } else grade = 'good';
        msgs.push('頭を守る姿勢をとっていなかったため、落下物が頭を直撃しました。');
      }
      if (grade === 'good' && L >= 2 && !A.underground){ grade = 'bad'; msgs.push('大地震では、身を隠せない場所では助かりませんでした。'); }
    } else {
      if (!A.indoor && !A.underground){
        const d = shelterSteps(A, x, y);
        if (d <= 10){ grade = 'bad'; msgs.push(`${d}マス先に建物や地下の入口があったのに、避難しませんでした。`); }
        else if (!crouch){ grade = 'bad'; msgs.push('立ったままで爆風と破片を受けました。'); }
        else msgs.push('近くに避難先がなく、地面に伏せて頭部を守りました。');
      } else if (!crouch && !A.underground){
        if (grade === 'perfect') grade = 'good'; else grade = 'bad';
        msgs.push('伏せて頭を守る姿勢をとっていませんでした。');
      }
    }
  }
  // 「なんとか助かる」場所は運しだい
  if (grade === 'good' && !stuck){
    const chance = type === 'eq' ? ([0.8, 0.6, 0, 0][L] ?? 0.6) : 0.75;
    if (luck(pid || 0) > chance){ grade = 'bad'; cause = cause || 'debris'; msgs.push('運悪く落下物が直撃しました。もっと安全な場所なら助かったかもしれません。'); }
  }
  return {grade, alive: grade !== 'bad', msgs, cause: grade === 'bad' ? (cause || 'debris') : null};
}

// 揺れのピーク・着弾の瞬間に生死が決まる
function impact(){
  const p = G.p, L = G.L;
  p.crushedFinal = !!(p.crushed || (!p.transit && pileUp(G.A.key, p.x, p.y, p)));
  const o = outcome(G.A, p.x, p.y, p.crouch, p.stuck, G.type, L, NET.online ? NET.id : 0, p.crushedFinal);
  const mult = G.type === 'eq' ? 1 + L*0.35 : 1.2;
  const base = o.alive ? Math.round({perfect:100, good:50}[o.grade] * mult) : 0;
  const bonus = o.alive && p.crouch ? Math.round(G.crouchLeft * 8) : 0;
  const stars = o.alive ? G.starPts : 0;
  G.res = {...o, score: base + bonus + stars, base, bonus, stars};
  const st = G.stats;
  st.rounds++; st.score += G.res.score;
  if (o.alive){ st.alive++; st.streak++; st.best = Math.max(st.best, st.streak); } else st.streak = 0;
  lsSet('alertStats', st);
  G.frozen = [];
  for (const q of NET.players.values()){
    const A = AREAS[q.a] ? getArea(q.a) : null; if (!A) continue;
    const r = outcome(A, q.tx, q.ty, !!q.c, q.tr === 2 ? 'elevator' : q.tr === 1 ? 'stairs' : null, G.type, L, q.id, !!q.k);
    G.frozen.push({...q, x:q.tx, y:q.ty, alive:r.alive, cause:r.cause, hidden: !!q.tr});
  }
  judgeNPCs();
  G.fx = makeFx(o.cause, o.alive);
  setAct('off');
  setMsg(o.alive ? '<b style="color:#69f0ae">生存</b>' : `<b style="color:#ff5252">死亡</b>　死因：${causeName(o.cause, G.A)}`);
  if (!o.alive){ sfxCrash(0.6); sfxThud(); if (navigator.vibrate) navigator.vibrate(600); }
  updHud();
}
function nearestTile(chars){
  let best = null, bd = 1e9;
  for (const c of chars) for (const q of (G.A.byChar[c] || [])){
    const d = Math.hypot(q.x+.5-G.p.x, q.y+.5-G.p.y);
    if (d < bd){ bd = d; best = {x:q.x+.5, y:q.y+.5}; }
  }
  return best;
}
function makeFx(cause, alive){
  const p = G.p;
  const f = {cause, alive, t0: nowMs(), to:{x:p.x, y:p.y}, from:null};
  if (alive) return f;
  if (cause === 'furniture') f.from = nearestTile(['S','K']);
  else if (cause === 'wall') f.from = nearestTile(['V']);
  else if (cause === 'fall') f.from = nearestTile(['L']);
  else if (cause === 'glass' || cause === 'blast'){
    const w = nearestTile(['W']) || {x:p.x, y:p.y-3};
    f.from = w;
    for (let i=0;i<26;i++){
      const a = Math.atan2(p.y-w.y, p.x-w.x) + rand(-.5,.5), sp = rand(4,9);
      spawn(w.x, w.y, Math.cos(a)*sp, Math.sin(a)*sp, 'rgba(200,240,255,.95)', rand(2,5), rand(.5,1));
    }
  }
  return f;
}

}

    <div id="rankBox"></div>

// ====== ランキング ======
function rankTable(rows, me, mode){
  const pct = e => e.rounds ? Math.round(e.alive / e.rounds * 100) + '%' : '-';
  const tr = (e, cls) => mode === 'alive'
    ? `<tr class="${cls||''}"><td>${e.n}</td><td>${esc(e.name)}</td><td class="al">${e.alive}</td><td>${pct(e)}</td><td>${e.best}</td></tr>`
    : `<tr class="${cls||''}"><td>${e.n}</td><td>${esc(e.name)}</td><td>${e.score}</td><td>${e.alive}/${e.rounds}</td><td>${e.best}</td></tr>`;
  let h = mode === 'alive'
    ? `<table class="rk"><tr><th>#</th><th>名前</th><th>生存</th><th>生存率</th><th>連続</th></tr>`
    : `<table class="rk"><tr><th>#</th><th>名前</th><th>スコア</th><th>生存</th><th>連続</th></tr>`;
  for (const e of rows) h += tr(e, me && e.n === me.n ? 'me' : '');
  if (me && !rows.some(e => e.n === me.n)) h += `<tr class="gap"><td colspan="5">…</td></tr>` + tr(me, 'me');
  return h + '</table>';
}
function renderRank(){
  const R = NET.rank;
  const has = R && R.alive && R.alive.length;
  const box = $('rankBox');
  if (box) box.innerHTML = has ? `<div class="rkh">🏆 生存ランキング（${R.total}人中 ${R.meA ? R.meA.n + '位' : '圏外'}）</div>` + rankTable(R.alive.slice(0, 5), R.meA, 'alive') : '';
  const tt = $('rankTitle');
  if (tt) tt.innerHTML = has ? rankTable(R.alive.slice(0, 10), R.meA, 'alive') : (R ? '<p style="color:var(--muted)">まだ記録がありません。最初の生存者になろう！</p>' : '読み込み中…');
  const full = $('rankFull');
  if (full){
    const tab = G.rankTab || 'alive';
    document.querySelectorAll('.rtab').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
    full.innerHTML = has ? (tab === 'alive' ? rankTable(R.alive, R.meA, 'alive') : rankTable(R.top, R.me, 'score'))
      : '<p style="color:var(--muted)">まだ記録がありません。生き残ってランクインしよう！</p>';
  }
}

// ====== 移動・エリア移動 ======
const walkA = (A, tx, ty) => tx>=0 && ty>=0 && tx<COLS && ty<ROWS && !SOLID.has(A.grid[ty][tx]);
const walk = (tx, ty) => walkA(G.A, tx, ty);
function canStand(x,y){
  const r = 0.27;
  return walk(Math.floor(x-r),Math.floor(y-r)) && walk(Math.floor(x+r),Math.floor(y-r)) &&
         walk(Math.floor(x-r),Math.floor(y+r)) && walk(Math.floor(x+r),Math.floor(y+r));
}
function bfs(sx, sy, gx, gy){
  if (!walk(gx,gy)) return null;
  const prev = new Map(), key = (x,y) => y*COLS+x, q = [[sx,sy]];
  prev.set(key(sx,sy), null);
  while (q.length){
    const [x,y] = q.shift();
    if (x===gx && y===gy){
      const path = []; let k = key(x,y);
      while (k !== null){ path.unshift({x:k%COLS, y:(k/COLS)|0}); k = prev.get(k); }
      return path;
    }
    for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = x+dx, ny = y+dy, nk = key(nx,ny);
      if (walk(nx,ny) && !prev.has(nk)){ prev.set(nk, key(x,y)); q.push([nx,ny]); }
    }
  }
  return null;
}
const LOW = new Set(['N','C']);   // ジャンプで飛び越えられる低い障害物
function canLand(x, y){
  const r = 0.27;
  for (const [ax, ay] of [[x-r,y-r],[x+r,y-r],[x-r,y+r],[x+r,y+r]]){
    const tx = Math.floor(ax), ty = Math.floor(ay);
    if (tx<0||ty<0||tx>=COLS||ty>=ROWS) return false;
    const c = G.A.grid[ty][tx];
    if (SOLID.has(c) && !LOW.has(c)) return false;
  }
  return true;
}
function startJump(){
  const p = G.p;
  if (!p || p.crouch || p.transit || p.jump || !(G.state === 'normal' || G.state === 'alert' || G.state === 'spectate')) return;
  const dx = p.dir ? p.dir.x : p.face, dy = p.dir ? p.dir.y : 0;
  // 着地点が立てる場所になる距離を探す（最大1.6マス）
  let dist = 0;
  for (let d = 1.6; d >= 0.4; d -= 0.1){ if (canStand(p.x+dx*d, p.y+dy*d)){ dist = d; break; } }
  p.jump = {t:0, dur:0.42, sx:p.x, sy:p.y, dx:dx*dist, dy:dy*dist};
  p.path = [];
  if (AC) beep(520, AC.currentTime, 0.12, 'triangle', 0.08);
}
function movePlayer(dt){
  const p = G.p;
  if (p.crouch || p.transit || p.crushed) return;
  const ox = p.x, oy = p.y;
  // スタミナ（走ると減り、走らないと回復）
  // スタミナ：走ると減る。0 になると息切れして、半分まで回復するまで走れない
  const wantRun = keys.run || btnRun;
  if (p.stamina <= 0 && !p.tired){ p.tired = true; p.say = {text:'ハァハァ…', until: nowMs() + 1800}; }
  if (p.tired && p.stamina >= 0.5) p.tired = false;
  const running = wantRun && !p.tired && p.stamina > 0;
  p.running = running && !!p.moving;
  p.stamina = clamp(p.stamina + (p.running ? -dt/3.2 : p.moving ? dt/7 : dt/3.5), 0, 1);
  runBtn.classList.toggle('tired', !!p.tired);
  if (p.jump){
    const j = p.jump; j.t += dt;
    const k = clamp(j.t/j.dur, 0, 1);
    const nx = j.sx + j.dx*k, ny = j.sy + j.dy*k;
    if (canLand(nx, ny)){ p.x = nx; p.y = ny; }
    p.hop = Math.sin(k*Math.PI) * 14;
    if (k >= 1){ p.jump = null; p.hop = 0; if (!canStand(p.x, p.y)){ p.x = j.sx; p.y = j.sy; } }
  } else {
    let dx = (keys.right?1:0) - (keys.left?1:0), dy = (keys.down?1:0) - (keys.up?1:0);
    let mag = 1;
    if (!dx && !dy && (stick.x || stick.y)){ dx = stick.x; dy = stick.y; mag = clamp(Math.hypot(dx,dy)*1.15, 0.35, 1); }
    let sp = 4.3 * dt * (running ? 1.7 : 1);
    p.moving = false;
    if (dx || dy){
      p.path = []; sp *= mag; p.moving = true;
      const l = Math.hypot(dx,dy); dx/=l; dy/=l;
      p.dir = {x:dx, y:dy};
      if (dx || dy) pushCrowd(p, dx, dy, sp);
      // ふさがっていても、押した分だけ少しずつ進める
      for (const k of [1, 0.34]){ if (canStand(p.x+dx*sp*k, p.y) && !crowdBlock(p, G.A.key, p.x+dx*sp*k, p.y)){ p.x += dx*sp*k; break; } }
      for (const k of [1, 0.34]){ if (canStand(p.x, p.y+dy*sp*k) && !crowdBlock(p, G.A.key, p.x, p.y+dy*sp*k)){ p.y += dy*sp*k; break; } }
      p.walk += dt * (running ? 1.6 : 1); if (dx) p.face = Math.sign(dx) || p.face;
    } else if (p.path.length){
      p.moving = true;
      const n = p.path[0], tx = n.x+.5, ty = n.y+.5;
      const ddx = tx-p.x, ddy = ty-p.y, d = Math.hypot(ddx,ddy);
      if (d > 0.001) p.dir = {x:ddx/d, y:ddy/d};
      if (d <= sp){ if (!crowdBlock(p, G.A.key, tx, ty)){ p.x = tx; p.y = ty; p.path.shift(); } }
      else if (!crowdBlock(p, G.A.key, p.x + ddx/d*sp, p.y + ddy/d*sp)){ p.x += ddx/d*sp; p.y += ddy/d*sp; if (Math.abs(ddx) > .01) p.face = Math.sign(ddx); }
      p.walk += dt;
    }
  }
  const tried = keys.up || keys.down || keys.left || keys.right || stick.x || stick.y || p.path.length;
  p.pushing = !!tried && Math.hypot(p.x-ox, p.y-oy) < 0.3*dt;
  // 出入口・階段・エレベーター
  const tk = Math.floor(p.y)*COLS + Math.floor(p.x);
  if (tk !== p.lastTile){
    p.lastTile = tk;
    const portal = G.A.portalAt[tk];
    if (portal && !p.jump) usePortal(portal);
  }
}
function usePortal(pt){
  const p = G.p;
  let dest;
  if (pt.to === '@back'){
    dest = backDest(G.A, p.back, true);
  } else {
    // 戻り先：入口のひとつ手前
    const back = backSpot(pt);
    p.back.push({area:G.A.key, x:back.x, y:back.y});
    dest = {area:pt.to, x:pt.tx, y:pt.ty};
  }
  if (!dest) return;
  p.path = [];
  if (pt.kind === 'door'){ moveTo(dest); return; }
  p.transit = {kind:pt.kind, dest, until: nowMs() + (pt.dur || 1.5)*1000, dur:(pt.dur || 1.5)};
  setMsg(pt.kind === 'elevator' ? '<b>エレベーターで移動中…</b>' : G.A.hStyle === 'escalator' ? '<b>エスカレーターで移動中…</b>' : '<b>階段で移動中…</b>');
  if (pt.kind === 'stairs') sfxStairs(pt.dur || 1.5);
  else if (AC) beep(880, AC.currentTime, 0.15, 'sine', 0.1);
}
function backSpot(pt){
  for (const [dx,dy] of [[0,1],[0,-1],[1,0],[-1,0]]){
    const x = pt.x+dx, y = pt.y+dy;
    if (walk(x,y) && !G.A.portalAt[y*COLS+x]) return {x:x+.5, y:y+.5};
  }
  return {x:pt.x+.5, y:pt.y+.5};
}
function moveTo(dest){
  const p = G.p;
  stopSteps();
  G.A = getArea(dest.area);
  G.locT0 = performance.now();
  p.x = dest.x; p.y = dest.y; p.transit = null; p.path = [];
  p.lastTile = Math.floor(p.y)*COLS + Math.floor(p.x);
  G.particles = [];
  if (G.state === 'normal' || G.state === 'alert'){
    bannerSubArea();
    setMsg(`<b>${G.A.name}</b>`);
  }
}
function bannerSubArea(){
  if (G.state === 'normal') $('bSub').textContent = `${G.A.name}にいます`;
}

// ====== 入力 ======
function toggleCrouch(){
  if (!['alert','shake'].includes(G.state) || G.p.transit || G.p.crushed) return;
  const p = G.p;
  if (G.state === 'shake' && p.crouch) return;
  p.crouch = !p.crouch; p.path = [];
  if (p.crouch){
    G.crouchLeft = G.state === 'alert' ? G.timer : 0;
    if (AC) beep(440, AC.currentTime, 0.1, 'sine', 0.15);
  }
  setAct(p.crouch ? 'on' : 'ready');
}
function setAct(mode){
  if (mode === 'start' || mode === 'next' || mode === 'result' || mode === 'resume'){
    actBtn.className = 'pb pa ' + (mode === 'start' || mode === 'resume' ? 'ready' : '');
    actBtn.innerHTML = '<i>A</i>' + {start:'参加', next:'マップ', result:'結果', resume:'続ける'}[mode];
    actBtn.dataset.mode = mode;
    return;
  }
  actBtn.dataset.mode = '';
  actBtn.className = 'pb pa ' + (mode === 'ready' ? 'ready' : mode === 'on' ? 'on' : '');
  const label = '伏せる';
  actBtn.innerHTML = '<i>A</i>' + (mode === 'on' ? '守って<br>いる' : label);
}
function actPress(){
  if (G.popup){ closePhone(); return; }
  const m = actBtn.dataset.mode;
  if (m === 'start'){ const b = $('startBtn') || $('cfOk'); if (b) b.click(); return; }
  if (m === 'resume'){ resumeIdle(); return; }
  if (m === 'next'){ const b = $('mapBtn'); if (b) b.click(); return; }
  if (m === 'result'){ showResult(); setAct('next'); return; }

// ====== 更新 ======
function spawn(x,y,vx,vy,color,size,life){ G.particles.push({x,y,vx,vy,color,size,life,max:life,rot:rand(0,6)}); }
function update(dt){
  const now = nowMs(), R = G.R, st = G.state;
  if (!R) return;
  const hitT = R.alert + R.limit*1000;
  const p = G.p;
  // 階段・エレベーター移動
  if (p && p.transit && !p.stuck && (st === 'normal' || st === 'alert') && now >= p.transit.until) moveTo(p.transit.dest);

  if (st === 'alert' && p && !p.transit && !p.crushed && updatePressure(p, G.A.key, dt, p.pushing)){
    p.crushed = true; p.path = []; p.crouch = false;
    setMsg('<b style="color:#ff5252">人込みで押しつぶされた…</b>'); setAct('off');
    sfxThud(); if (navigator.vibrate) navigator.vibrate(500);
  }
  if (st === 'normal' || st === 'alert'){
    movePlayer(dt);
    G.stars = G.stars.filter(s => {
      if (s.a === G.A.key && !p.transit && Math.hypot(s.x-p.x, s.y-p.y) < .55){ G.starPts += 10; sfxStar(); return false; }
      return true;
    });
    if (st === 'normal' && now >= R.alert) triggerAlert();
    if (G.state === 'alert'){
      G.timer = (hitT - now)/1000;
      $('bTime').textContent = `あと ${Math.max(0,G.timer).toFixed(1)}秒`;
      if (G.timer <= 0){ G.timer = 0; G.type === 'eq' ? startShake() : missileEnd(); }
    }
  } else if (st === 'shake'){
    G.phaseT = (now - hitT)/1000;
    const k = G.phaseT, P = R.post, m = 0.7 + G.L*0.35;
    G.shakeAmt = (k < 0.6 ? k/0.6*4 : k < P-1.2 ? 7 + Math.sin(k*7)*2 : Math.max(0, 7*(P-0.2-k))) * m;
    if (k < P - 1){
      const bc = G.A.byChar;
      if (Math.random() < dt*6) for (const w of shuffle([...(bc.W||[])]).slice(0,2)){
        for (let i=0;i<5;i++) spawn(w.x+.5, w.y+.5, rand(-2.5,2.5), rand(-2.5,2.5), 'rgba(178,235,242,.95)', rand(2,4), rand(.6,1.2));
        if (Math.random() < .4) sfxCrash(0.12);
      }
      if (Math.random() < dt*5) for (const s of shuffle([...(bc.S||[]), ...(bc.K||[])]).slice(0,2)){
        const cols = ['#e57373','#64b5f6','#81c784','#ffd54f','#fff'];
        spawn(s.x+rand(.1,.9), s.y+rand(.2,.8), rand(-1.6,1.6), rand(-1.6,1.6), cols[Math.random()*5|0], rand(3,5), rand(.8,1.6));
        if (Math.random() < .3) sfxCrash(0.18);
      }
      if (!G.A.indoor && Math.random() < dt*8){
        for (const s of shuffle([...(bc.B||[]), ...(bc.V||[])]).slice(0,3))
          spawn(s.x+rand(0,1), s.y+rand(0,1), rand(-1.6,1.6), rand(-1.6,1.6), Math.random()<.5?'rgba(178,235,242,.95)':'#9e9e9e', rand(2,5), rand(.6,1.2));
        if (Math.random() < .3) sfxCrash(0.15);
      }
      // 大地震：天井や外壁の破片があちこちに落ちる
      if (G.L >= 2 && Math.random() < dt*G.L*4){
        const x = rand(0, COLS), y = rand(0, ROWS);
        for (let i=0;i<6;i++) spawn(x, y, rand(-1.2,1.2), rand(-1.2,1.2), Math.random()<.5 ? '#8d8d8d' : '#bcaaa4', rand(2,5), rand(.7,1.4));
        if (Math.random() < .5) sfxCrash(0.2);
      }
    }
    if (!G.res && k >= P*0.55) impact();
    if (k >= P){ G.shakeAmt = 0; G.state = 'after'; G.afterUntil = now + 2200; }
  } else if (st === 'pass'){
    // ミサイル着弾
    G.phaseT = (now - hitT)/1000;
    if (!G.res && G.phaseT >= 1.0){
      G.boomT = now; G.shakeAmt = 14; sfxBoom();
      for (const w of (G.A.byChar.W || [])) for (let i=0;i<3;i++)
        spawn(w.x+.5, w.y+.5, rand(-3,3), rand(-3,3), 'rgba(200,240,255,.95)', rand(2,4), rand(.6,1.2));
      impact();
    }
    if (G.boomT) G.shakeAmt = Math.max(0, 14 * (1 - (now - G.boomT)/1000));
    if (G.phaseT >= R.post){ G.state = 'after'; G.afterUntil = now + 2200; }
  } else if (st === 'after'){
    G.shakeAmt *= Math.pow(0.02, dt);
    if (now >= G.afterUntil) finishRound();
  } else if (st === 'result' || st === 'spectate'){
    if (st === 'spectate') movePlayer(dt);
    const left = Math.max(0, (R.next - now)/1000);
    const ni = $('nextInfo'); if (ni) ni.textContent = `次のラウンドまで ${left.toFixed(0)}秒`;
    if (st === 'result') $('bSub').textContent = `次のラウンドまで ${left.toFixed(0)}秒`;
    if (now >= R.next + (NET.online ? 3000 : 0) && !NET.online) onRound(makeLocalRound());
  }
  updateNPCs(dt);
  for (const q of G.particles){ q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= .96; q.vy *= .96; q.life -= dt; q.rot += dt*5; }
  G.particles = G.particles.filter(q => q.life > 0);
  // 他プレイヤーを滑らかに
  const k = 1 - Math.pow(0.0005, dt);
  for (const o of NET.players.values()){
    const mv = Math.hypot(o.tx - o.x, o.ty - o.y) > 0.02;
    o.x += (o.tx - o.x)*k; o.y += (o.ty - o.y)*k;
    if (mv && !o.c) o.walk = (o.walk||0) + dt*(o.d ? 1.6 : 1);
  }
}

function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x,y,w,h,r) : ctx.rect(x,y,w,h); }
function drawTile(A, c, x, y){
  const X = x*T, Y = y*T;
  const fl = () => { if (paintFloor(A, x, y, X, Y)) return; ctx.fillStyle = A.floor; ctx.fillRect(X,Y,T,T);
    if (A.floorStyle === 'check'){
      // 店の白い市松タイル
      ctx.fillStyle = 'rgba(120,110,90,.10)'; ctx.fillRect(X,Y,T/2,T/2); ctx.fillRect(X+T/2,Y+T/2,T/2,T/2);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(X+2,Y+2,4,1);
      return;
    }
    if (A.floorStyle === 'concrete'){
      // コンクリート＋黄色の安全通路線
      ctx.fillStyle = 'rgba(0,0,0,.06)'; ctx.fillRect(X+((x*7+y*13)%9)*3, Y+((x*11+y*5)%9)*3, 3, 2); ctx.fillRect(X+((x*3+y*17)%9)*3, Y+((x*5+y*7)%9)*3, 2, 2);
      ctx.strokeStyle = 'rgba(0,0,0,.12)'; ctx.strokeRect(X+.5, Y+.5, T, T);
      if (A.key === 'warehouse' && (y === 5 || y === 9 || y === 1)){ ctx.fillStyle = '#f9c80e'; ctx.fillRect(X, Y+T-4, T, 3); }
      if (A.key === 'warehouse' && x === 17 && y >= 1 && y <= 9){ ctx.fillStyle = 'rgba(249,200,14,.8)'; for (let i=0;i<4;i++) ctx.fillRect(X+2+i*8, Y+2, 4, T-4); }
      return;
    }
    if (A.indoor){ ctx.strokeStyle = 'rgba(0,0,0,.06)'; ctx.beginPath(); ctx.moveTo(X,Y+T/2); ctx.lineTo(X+T,Y+T/2); ctx.stroke(); }
    else { ctx.strokeStyle = 'rgba(0,0,0,.08)'; ctx.strokeRect(X+.5,Y+.5,T-1,T-1); } };
  const shaking = G.state === 'shake';
  const label = (t, col) => { ctx.fillStyle = col || '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText(t, X+T/2, Y+T/2+3); };
  switch (c){
    case '.': fl(); break;
    case 'I': ctx.fillStyle = A.underground ? '#9ea3a3' : '#b8c4cc'; ctx.fillRect(X,Y,T,T);
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.strokeRect(X+.5,Y+.5,T/2,T/2); ctx.strokeRect(X+T/2+.5,Y+T/2+.5,T/2-1,T/2-1); break;
    case 'G': ctx.fillStyle = A.key === 'schoolYard' ? '#cdb388' : A.key === 'stadium' ? (y % 2 ? '#3f9b45' : '#4caf50') : '#7cb342'; ctx.fillRect(X,Y,T,T);
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(X+((x*7+y*3)%5)*5+3, Y+((x*3+y*5)%5)*5+4, 3, 3); break;
    case 'T': if (A.key === 'shrine'){
        ctx.fillStyle = '#4e6b3a'; ctx.fillRect(X,Y,T,T);
        ctx.fillStyle = '#1b3d22'; ctx.beginPath(); ctx.moveTo(X+T/2, Y+1); ctx.lineTo(X+T-3, Y+T-4); ctx.lineTo(X+3, Y+T-4); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#2e5a33'; ctx.beginPath(); ctx.moveTo(X+T/2, Y+6); ctx.lineTo(X+T-8, Y+T-8); ctx.lineTo(X+8, Y+T-8); ctx.closePath(); ctx.fill();
        break;
      }
      ctx.fillStyle = '#7cb342'; ctx.fillRect(X,Y,T,T);
      ctx.fillStyle = '#33691e'; ctx.beginPath(); ctx.arc(X+T/2,Y+T/2,T*.44,0,7); ctx.fill();
      ctx.fillStyle = '#558b2f'; ctx.beginPath(); ctx.arc(X+T*.42,Y+T*.4,T*.25,0,7); ctx.fill(); break;
    case 'R': ctx.fillStyle = '#4a4f57'; ctx.fillRect(X,Y,T,T);
      if (tileOf(A, x+.5, y+1.5) === 'R'){ ctx.fillStyle = '#f5f5f5'; ctx.fillRect(X+4, Y+T-2, T/2, 4); } break;
    case '#': ctx.fillStyle = A.wall; ctx.fillRect(X,Y,T,T); ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(X,Y,T,3); break;
    case 'W': {

      ctx.fillStyle = '#9fd8f0'; ctx.fillRect(gx,gy,gw,gh);

const stickEl = $('stick'), knob = $('knob');

function stickMove(e){
  const r = stickEl.getBoundingClientRect();
  const R = r.width/2, max = R*0.62;
  let dx = e.clientX - (r.left+R), dy = e.clientY - (r.top+R);

  if (d > max){ dx = dx/d*max; dy = dy/d*max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const m = Math.hypot(dx,dy)/max;

function dropDebris(list, x, z, n, spread, t0, delay){
  const out = [];
  for (let i = 0; i < n; i++){
    const m = mkDebris(list[Math.floor(Math.random()*list.length)]);
    const ty = .04 + Math.random()*.06;
    m.userData = {x: x + (Math.random()-.5)*spread, z: z + (Math.random()-.5)*spread, ty, sy: 2.6 + Math.random()*1.5, d: (delay || 0) + Math.random()*.25, t0, spin: (Math.random()-.5)*8, rx: m.rotation.x};
    m.position.set(m.userData.x, m.userData.sy, m.userData.z);
    out.push(m);
  }
  return out;
}
function animDebris(list, now){
  for (const m of list){
    const u = m.userData, t = (now - u.t0)/1000 - u.d;
    if (t < 0){ m.visible = false; continue; }
    m.visible = true;
    const k = Math.min(1, t/.45);
    const bounce = k >= 1 ? Math.max(0, Math.sin((t - .45)*14)*Math.exp(-(t - .45)*8)*.12) : 0;
    m.position.set(u.x, u.sy + (u.ty - u.sy)*k*k + bounce, u.z);
    if (k < 1) m.rotation.x = u.rx + t*u.spin;
  }
}

const FLAT_UNDER = new Set(['D','Z','Q','J','H','U','Y','X','E','T','A','M','O','N','C','V','K','S','B','#','W','F','%','L','~']);
function paintArea(A, full){
  const c = document.createElement('canvas'); c.width = COLS*T*2; c.height = ROWS*T*2;
  const old = ctx, oldState = G.state;
  ctx = c.getContext('2d'); ctx.setTransform(2,0,0,2,0,0);
  G.state = 'normal';
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++){
    const ch = A.grid[y][x];
    if (full || !FLAT_UNDER.has(ch)) drawTile(A, ch, x, y);
    else if (ch === 'L' || ch === '~' || ch === '%') drawTile(A, ch, x, y);
    else drawTile(A, A.indoor ? (ch === '#' || ch === 'W' ? '#' : '.') : (ch === 'B' || ch === 'E' || ch === 'F' ? '.' : ch === 'T' ? 'G' : '.'), x, y);

// 箱の天面に、2D 版のそのマスの絵を貼る
function topMapped(geo, cx, cz){
  const pos = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 8; i < 12; i++){
    const wx = cx + pos.getX(i), wz = cz + pos.getZ(i);
    uv.setXY(i, wx / COLS, 1 - wz / ROWS);
  }
  uv.needsUpdate = true;
}
function tileColor(img, x, y){
  let r = 0, g = 0, b = 0, n = 0;
  for (let yy = 10; yy < 54; yy += 6) for (let xx = 10; xx < 54; xx += 6){
    const i = ((y*64 + yy) * img.width + (x*64 + xx)) * 4;
    r += img.data[i]; g += img.data[i+1]; b += img.data[i+2]; n++;
  }
  return new THREE.Color(r/n/255*.82, g/n/255*.82, b/n/255*.82).convertSRGBToLinear();
}
const SOLID_H = {'#':1.25, 'S':1.75, 'K':1.45, 'C':.45, 'N':.5, 'B':3.0, 'F':3.0, 'A':.95, 'O':2.5, 'V':1.05, 'W':1.25};
function tileHeight(A, ch, x, y){
  if (ch === 'K') return ({campfire:.25, stove:.95, case:1.15, arcade:1.6, speaker:1.9, shower:1.1, cooler:1.8})[A.kStyle] || SOLID_H.K;
  if (ch === 'S') return ({container:2.4, rack:2.3, toys:1.0, ufo:1.7, shoebox:1.4, locker:1.7, goods:1.6, market:1.4})[A.sStyle] || SOLID_H.S;

  if (ch === 'C') return A.cStyle === 'tent' ? 1.1 : .45;
  return SOLID_H[ch] || 1;
}

const GRAY = new THREE.Color(0x8a8a8a);
function poseChar3(g, o, dt){
  const u = g.userData;

  if (o.dead){
    if (!u.wasDead){ u.wasDead = true; u.deadT = 0; }
    u.deadT += dt;
    const k = Math.min(1, u.deadT/0.35);
    u.inner.rotation.x = -Math.PI/2 * (1 - Math.pow(1-k, 3));
    u.inner.position.set(0, .18*k, .35*k);
    u.legL.rotation.x = u.legR.rotation.x = 0; u.armL.rotation.x = u.armR.rotation.x = 0;
    u.body.scale.set(1, 1, 1); u.body.position.y = .55; u.head.position.y = 1.03; u.hair.position.y = 1.05;
    u.legL.visible = u.legR.visible = true;
    u.bodyM.color.copy(u.color).lerp(GRAY, Math.min(1, u.deadT*1.5));
    u.skinM.color.set(0xffcc80).lerp(new THREE.Color(0xbdbdbd), Math.min(1, u.deadT*1.5));
    const st = u.deadT - .5;
    u.soul.material.opacity = st > 0 ? Math.max(0, .75 - st*.25) : 0;
    u.soul.position.set(Math.sin(st*3)*.12, .6 + Math.max(0, st)*.9, .3);
    u.soul.scale.setScalar(1 + Math.max(0, st)*.15);
    return;
  }
  if (u.wasDead){ u.wasDead = false; u.inner.rotation.x = 0; u.inner.position.set(0, 0, 0); u.bodyM.color.copy(u.color); u.skinM.color.set(0xffcc80); u.soul.material.opacity = 0; }

    // だんごむしのポーズ
    u.body.scale.set(1.2, .6, 1.25); u.body.position.y = .3; u.head.position.y = .52; u.hair.position.y = .54;
    u.legL.visible = u.legR.visible = false;
    u.armL.position.set(-.16, .62, .04); u.armR.position.set(.16, .62, .04);
    u.armL.rotation.set(0, 0, -.9); u.armR.rotation.set(0, 0, .9);
    u.inner.rotation.x = .35;
  } else {
    const w = o.walk || 0, s = Math.sin(w*10), bob = Math.abs(s)*.03;
    u.body.scale.set(1, 1, 1); u.body.position.y = .55 + bob; u.head.position.y = 1.03 + bob; u.hair.position.y = 1.05 + bob;
    u.legL.visible = u.legR.visible = true;
    u.legL.rotation.x = s*.55; u.legR.rotation.x = -s*.55;
    u.armL.position.set(-.26, .62 + bob, 0); u.armR.position.set(.26, .62 + bob, 0);
    u.armL.rotation.set(-s*.5, 0, 0); u.armR.rotation.set(s*.5, 0, 0);
    u.inner.rotation.x = 0;

  u.shadow.position.y = .015 - (o.hop || 0);

}
function syncChar(id, o, color, dt){
  let g = CH3.get(id);

  g.visible = true; g.userData.seen = true;

    if (tr.prog === undefined){ tr.prog = 0; tr.flights = Math.min(TR3.flightEnd.length, Math.max(1, Math.abs(f1 - f0))); }
    if (!p.stuck && tr.prog < 1){
      // 入力の向きを、画面上で「行き先へ続く向き」と比べる：合っていれば進み、逆なら戻る
      const ix = (keys.right?1:0) - (keys.left?1:0), iy = (keys.down?1:0) - (keys.up?1:0);
      const vx = ix || stick.x, vy = iy || stick.y, vm = Math.hypot(vx, vy);
      let fwd = 0;
      if (stairHold) fwd = 1;
      else if (vm > .2 && tr.lastPt && tr.lastAhead){
        const a = proj(tr.lastPt.x, tr.lastPt.y + .5, tr.lastPt.z), b = proj(tr.lastAhead.x, tr.lastAhead.y + .5, tr.lastAhead.z);
        if (a && b){ const sx = b.X - a.X, sy = b.Y - a.Y, sl = Math.hypot(sx, sy) || 1; fwd = (vx*sx + vy*sy)/sl/vm; }
      }
      const dir = fwd > .25 ? 1 : fwd < -.25 ? -1 : 0;
      if (p.stamina <= 0) p.tired = true;
      if (p.tired && p.stamina >= .5) p.tired = false;
      const running = dir !== 0 && (keys.run || btnRun) && !p.tired;
      p.stamina = clamp(p.stamina + (running ? -dt/3.2 : dt/4.5), 0, 1);
      let sp, len;
      if (esc){
        // エスカレーター：踏み段の上だけ自動で運ばれる。床の上は自分で歩く。逆向きに歩けば戻れる
        len = TR3.escPath.reduce((a, q, i) => i ? a + q.distanceTo(TR3.escPath[i-1]) : 0, 0);
        const d = tr.prog * len, onBelt = d > 2.2 && d < len - 2.2;
        sp = (onBelt ? 1.3 : 0) + dir*(running ? (onBelt ? 3.2 : 5) : (onBelt ? 1.8 : 3.2));
        tr.onBelt = onBelt;
        tr.walkT = (tr.walkT || 0) + dt*(dir ? (running ? 1.6 : 1) : 0);
      } else {
        // 階段：入力した向きに上り下りする（止まっていれば止まる）
        len = TR3.flightEnd[tr.flights - 1];
        sp = dir*(running ? 6.2 : 3.4);
        tr.walkT = (tr.walkT || 0) + dt*(dir ? (running ? 1.6 : 1) : 0);
      }
      tr.walkDir = dir;
      tr.prog = Math.min(1, tr.prog + sp*dt/len);
      tr.running = running;
      // 入口まで戻りきったら、元の階に戻る
      tr.backHold = tr.prog <= 0 && dir < 0 ? (tr.backHold || 0) + dt : 0;
      if (tr.backHold > .35){ tr.prog = 0; leaveTransit(); return drawTransit3D(now, dt); }
      tr.prog = Math.max(0, tr.prog);
      // 2D 版の時間切れで勝手に着かないよう、着くまで待たせる
      tr.until = tr.prog >= 1 ? nowMs() - 1 : nowMs() + 60000;
      tr.dur = 60;
    }
  }
  if (tr.kind === 'elevator'){
    if (!tr.phase){ tr.phase = 'wait'; tr.rideDur = tr.dur; }
    if (tr.phase === 'wait' && !p.stuck){ tr.until = nowMs() + 60000; tr.dur = 60; }
    if (evBuiltFor !== tr){ evBuiltFor = tr; buildEvPanel(false); }
    evPanel.style.display = p.stuck ? 'none' : 'block';
  } else evPanel.style.display = 'none';
  const left = Math.max(0, (tr.until - nowMs())/1000);
  const prog = tr.kind === 'stairs' ? tr.prog : tr.phase === 'wait' ? 0 : (p.stuck ? (tr.stuckProg ?? (tr.stuckProg = 1 - left/tr.dur)) : clamp(1 - left/tr.dur, 0, 1));
  let cur = Math.round(f0 + (f1 - f0)*prog); if (cur === 0) cur = down ? -1 : 1;
  if (W3.group) W3.group.visible = false;
  for (const g of CH3.values()) g.visible = false;
  marker3.visible = false; starMeshes.forEach(m => m.visible = false); pts3.visible = false;
  R.hemi.intensity = .5; R.sun.intensity = .2; R.alarm.intensity = 0; R.torch.intensity = 0;
  R.scene.background.set(0x14181f); R.scene.fog.color.set(0x14181f);
  let me = CH3.get('me'); if (!me){ me = makeChar3(0xff7043); CH3.set('me', me); }
  me.visible = true;
  const shaking = G.state === 'shake' || p.stuck;
  if (tr.kind === 'elevator'){
    TR3.stairs.visible = false; if (TR3.esc) TR3.esc.visible = false; const g = TR3.elev; g.visible = true;
    g.position.set(40, 0, 40);
    const u = g.userData;
    u.doorL.visible = u.doorR.visible = tr.phase !== 'wait';
    const red = !!p.stuck;
    u.light.color.set(red ? 0xff2a2a : 0xffffff); u.light.intensity = red ? (.6 + Math.sin(now/90)*.4) : 1.1;
    u.ceil.material.emissive.set(red ? 0x550000 : 0xffffff);
    g.position.x += shaking ? (Math.random()-.5)*.08 : 0; g.position.y = shaking ? (Math.random()-.5)*.05 : Math.sin(now/300)*.005;
    me.position.set(g.position.x, g.position.y, 40); me.rotation.y = 0;
    poseChar3(me, {crouch: p.crouch, walk: 0, dead: false}, dt);
    // かごの中（扉の内側）から見る
    R.camera.position.set(g.position.x + .75, 2.15, 40.95); R.camera.lookAt(g.position.x - .1, .75, 39.75);
  } else if (tr.esc){
    TR3.elev.visible = false; TR3.stairs.visible = false; const g = TR3.esc; g.visible = true;
    g.position.set(-40, 0, -40);
    const u = g.userData;
    // 踏み段を流す（止まると止まる）
    if (!p.stuck) u.off = ((u.off || 0) + dt*1.3*(down ? -1 : 1) + 100) % .4;
    u.steps.forEach((st, i) => { const d = (i*.4 + (u.off || 0)) % (u.L + .4) - .2; st.position.set(Math.cos(u.ang)*d, Math.sin(u.ang)*d + .02, 0); st.visible = d > -.1 && d < u.L + .1; });
    const pts = TR3.escPath, total = pts.reduce((a, q, i) => i ? a + q.distanceTo(pts[i-1]) : 0, 0);
    const dd = (down ? 1 - prog : prog) * total;
    let rem = dd, pt = pts[0].clone();
    for (let i = 1; i < pts.length; i++){ const seg = pts[i].distanceTo(pts[i-1]); if (rem <= seg){ pt = pts[i-1].clone().lerp(pts[i], rem/seg); break; } rem -= seg; pt = pts[i].clone(); }
    pt.add(g.position);
    me.position.copy(pt);
    const ad = clamp(dd + (down ? -.2 : .2), 0, total); let rem2 = ad, ah = pts[0].clone();
    for (let i = 1; i < pts.length; i++){ const seg = pts[i].distanceTo(pts[i-1]); if (rem2 <= seg){ ah = pts[i-1].clone().lerp(pts[i], rem2/seg); break; } rem2 -= seg; ah = pts[i].clone(); }
    ah.add(g.position); tr.lastPt = pt.clone(); tr.lastAhead = ah;
    me.rotation.y = (tr.walkDir || 1) > 0 === down ? -Math.PI/2 : Math.PI/2;
    poseChar3(me, {crouch:false, walk: p.stuck ? 0 : (tr.walkT || 0), dead: !!p.stuck}, dt);
    u.lamp.position.set(pt.x - g.position.x, pt.y + 3, 2);
    if (shaking) g.position.x += (Math.random()-.5)*.1;
    R.camera.position.set(pt.x + .4, pt.y + 2.6, pt.z + 6.4); R.camera.lookAt(pt.x + .3, pt.y + .4, pt.z);
  } else {
    TR3.elev.visible = false; if (TR3.esc) TR3.esc.visible = false; const g = TR3.stairs; g.visible = true;
    g.position.set(-40, 0, 40);
    const total = TR3.flightEnd[tr.flights - 1];
    const d = (down ? prog : 1 - prog) * total;
    const pt = stairsPoint(0, d).add(g.position);
    const ahead = stairsPoint(0, clamp(d + (down ? .15 : -.15), 0, total)).add(g.position);
    me.position.copy(pt);
    tr.lastPt = pt.clone(); tr.lastAhead = ahead.clone();
    if (ahead.distanceTo(pt) > 1e-4){ const back = (tr.walkDir || 1) < 0; me.rotation.y = Math.atan2(ahead.x - pt.x, ahead.z - pt.z) + (back ? Math.PI : 0); }
    // 揺れで転倒
    poseChar3(me, {crouch:false, walk: p.stuck ? 0 : (tr.walkT || 0), dead: !!p.stuck}, dt);
    g.userData.lamp.position.set(pt.x - g.position.x, pt.y - g.position.y + 2, 1);
    if (shaking){ g.position.x += (Math.random()-.5)*.1; }
    R.camera.position.set(pt.x + 1.2, pt.y + 3.4, pt.z + 7.2); R.camera.lookAt(pt.x, pt.y + .3, pt.z + .6);
  }
  R.renderer.render(R.scene, R.camera);
  // 重ね表示：階数・行き先・残り時間
  ctx.fillStyle = 'rgba(0,0,0,.65)'; rr(SW/2 - 150, 14, 300, 92, 12); ctx.fill();
  ctx.textAlign = 'center';
  if (p.stuck){
    ctx.fillStyle = '#ff5252'; ctx.font = 'bold 22px sans-serif';
    ctx.fillText(tr.kind === 'elevator' ? '⚠ 緊急停止' : tr.esc ? '⚠ エスカレーター緊急停止' : '階段で揺れに遭遇！', SW/2, 48);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
    ctx.fillText(tr.kind === 'elevator' ? `${floorLabel(cur)} と ${floorLabel(cur + (down ? -1 : 1))} の間で止まりました` : 'バランスを崩して転落…', SW/2, 74);
  } else {
    ctx.fillStyle = '#ffca28'; ctx.font = 'bold 30px sans-serif';
    ctx.fillText(tr.kind === 'elevator' && tr.phase === 'wait' ? floorLabel(f0) : `${down ? '▼' : '▲'} ${floorLabel(cur)}`, SW/2, 52);
    if (tr.kind === 'elevator' && tr.phase === 'wait'){
      ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(SW/2 - 170, SH - 46, 340, 30, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
      ctx.fillText(`右のパネルで行き先（${floorLabel(f1)}）のボタンを押す　開：降りる`, SW/2, SH - 26);
    }
    if (tr.kind === 'elevator' && tr.phase === 'ride' && left < .05 && !tr.dinged){ tr.dinged = true; evDing(); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
    ctx.fillText(`${tr.kind === 'elevator' ? 'エレベーター' : tr.esc ? 'エスカレーター' : '階段'}　${floorLabel(f0)} → ${floorLabel(f1)}　${areaName(tr.dest.area)}`, SW/2, 76);
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(SW/2 - 120, 88, 240, 5);
    ctx.fillStyle = '#ffca28'; ctx.fillRect(SW/2 - 120, 88, 240*prog, 5);
    if (tr.kind === 'stairs'){
      ctx.fillStyle = 'rgba(0,0,0,.6)'; rr(SW/2 - 170, SH - 46, 340, 30, 8); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 13px sans-serif';
      ctx.fillText(tr.esc ? (tr.onBelt ? '自動で運ばれています（スティックで歩く・逆向きで戻る／Bでダッシュ）' : 'スティック・矢印キーで歩いて乗り降り（戻れば元の階へ）') : `スティック・矢印キーで自由に${down ? '降りる' : '上る'}・戻る（戻りきると元の階へ）／Bでダッシュ`, SW/2, SH - 26);
      if (p.stamina < 1){ ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(SW/2 - 60, SH - 58, 120, 6); ctx.fillStyle = p.tired ? '#ff3d00' : '#4fc3f7'; ctx.fillRect(SW/2 - 60, SH - 58, 120*p.stamina, 6); }
    }
  }
  if (G.state === 'alert' || G.state === 'shake'){
    const a = (Math.sin(now/120)+1)/2 * .14;
    const grd = ctx.createRadialGradient(SW/2, SH/2, 120, SW/2, SH/2, 420);
    grd.addColorStop(0, 'rgba(255,0,0,0)'); grd.addColorStop(1, `rgba(255,0,0,${a*3})`);
    ctx.fillStyle = grd; ctx.fillRect(0, 0, SW, SH);
  }
  drawVerdict();
  return true;
}

// ====== ループ ======
let last = performance.now();
function loop(t){
  const dt = Math.min(0.05, (t - last)/1000); last = t;
  update(dt);
  draw3D(t, dt);
  requestAnimationFrame(loop);
}
updHud();
showTitle();
connect();   // 参加前でもランキングを表示するため接続しておく
requestAnimationFrame(loop);
})();
</script>
</body>
